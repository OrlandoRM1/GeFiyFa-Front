<div class="register-container">
  <div class="register-header">
    <img src="GeFiyFaIcon.png" alt="Logo Optima" class="register-logo" />
    <h1>Crear cuenta</h1>
    <p class="register-subtitle">Registra un nuevo usuario para acceder al sistema.</p>
  </div>

  <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="register-form">
    <div class="form-grid">
      <div class="form-group">
        <label for="name">Nombre</label>
        <input id="name" name="name" type="text" required class="form-control" placeholder="Nombre"
          [ngModel]="name()" (ngModelChange)="name.set($event)" />
      </div>

      <div class="form-group">
        <label for="lastName">Apellidos</label>
        <input id="lastName" name="lastName" type="text" required class="form-control" placeholder="Apellidos"
          [ngModel]="lastName()" (ngModelChange)="lastName.set($event)" />
      </div>
    </div>

    <div class="form-group">
      <label for="birthdate">Fecha de nacimiento</label>
      <input id="birthdate" name="birthdate" type="date" class="form-control"
        [ngModel]="birthdate()" (ngModelChange)="birthdate.set($event)" />
    </div>

    <div class="form-group">
      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" required class="form-control" placeholder="Nombre de usuario"
        [ngModel]="username()" (ngModelChange)="username.set($event)" />
    </div>

    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" required email class="form-control" placeholder="correo@empresa.com"
        [ngModel]="email()" (ngModelChange)="email.set($event)" />
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required class="form-control" placeholder="Contraseña"
          [ngModel]="password()" (ngModelChange)="password.set($event)" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input id="confirmPassword" name="confirmPassword" type="password" required class="form-control" placeholder="Repite la contraseña"
          [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)" />
      </div>
    </div>

    <div class="register-message" [class.success]="isSuccess()" [hidden]="!message()" role="alert" aria-live="polite">
      {{ message() }}
    </div>

    <button type="submit" class="btn-block" [disabled]="isLoading()">
      {{ isLoading() ? 'Registrando...' : 'Registrar usuario' }}
    </button>
  </form>

  <p class="login-link">¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a></p>
</div>
