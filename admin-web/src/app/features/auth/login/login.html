<div class="login-container">
  <div class="login-header">
    <img src="GeFiyFaIcon.png" alt="Logo Optima" class="login-header-image" />
    <h1>Iniciar sesión</h1>
  </div>

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
    <div class="form-group">
      <label for="username">Usuario</label>
      <input
        type="text"
        id="username"
        required
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
        name="username"
        class="form-control"
        placeholder="Ingresa tu usuario"
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        required
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        name="password"
        class="form-control"
        placeholder="Ingresa tu contraseña"
      />
    </div>

    <div class="login-message" [hidden]="!message()" role="alert" aria-live="polite">{{ message() }}</div>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading()" [attr.aria-busy]="isLoading()">
      @if (isLoading()) {
        <span class="loading-indicator" aria-hidden="true"></span>
        <span>Ingresando...</span>
      } @else {
        <span>Ingresar</span>
      }
    </button>
  </form>

  <p class="register-link">¿No tienes una cuenta? <a routerLink="/register">Regístrate</a></p>
</div>
